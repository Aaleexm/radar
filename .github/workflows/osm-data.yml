# Cada semana actualiza los archivos de radares que usa la app:
#  - data/radares-osm.json: todos los radares de OpenStreetMap en España (Geofabrik), sin depender de Overpass.
#  - data/radares-oficiales.json: Servei Català de Trànsit, Ayuntamiento de Madrid y tramos INVIVE de la DGT.
name: Datos de radares

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # lunes a las 04:17 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -q osmium

      - name: Descargar OpenStreetMap de España
        run: curl -sSfL -o spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf

      - name: Extraer radares
        run: |
          osmium tags-filter spain.osm.pbf n/highway=speed_camera r/type=enforcement -o radares.osm.pbf --overwrite
          mkdir -p data
          python scripts/build_osm_radars.py radares.osm.pbf data/radares-osm.json

      - name: Radares oficiales (Cataluña, Madrid, INVIVE)
        run: python scripts/build_official_radars.py data/radares-oficiales.json

      - name: Guardar en el repositorio si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radares-osm.json data/radares-oficiales.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar datos de radares"
          git push
